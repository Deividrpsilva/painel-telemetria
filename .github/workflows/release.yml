# Gera o instalador e publica a Release.
#  - Ao enviar uma tag "v*" (ex.: v6.0), ou ao criar uma Release pelo site com uma tag nova.
#  - Pela aba Actions > "Gerar instalador" > Run workflow: com "versao" preenchida (ex.: v7.0)
#    cria a tag e publica a Release; vazia, só gera os arquivos (ficam em Artifacts).
name: Gerar instalador

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão para publicar (ex.: v7.0). Deixe vazio para só gerar os arquivos."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  instalador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar o NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Montar pacote e instalador
        run: python scripts/montar_pacote.py

      - name: Guardar os arquivos gerados
        uses: actions/upload-artifact@v4
        with:
          name: PULSE
          path: dist/*

      - name: Publicar a Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.versao != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.versao || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: PULSE — System Telemetry ${{ inputs.versao || github.ref_name }}
          body_path: .github/release.md
          generate_release_notes: true
          files: dist/*
